name: Fleet watch

on:
  schedule:
    # Every 2 h during Prague daytime — the ratchet in check-ac-fleet.mjs
    # only needs to catch a new tram in service once.
    - cron: "23 4-20/2 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: check
        run: node scripts/check-ac-fleet.mjs
        env:
          GOLEMIO_API_KEY: ${{ secrets.GOLEMIO_API_KEY }}
      # The retrofit list will eventually outgrow the line width; keep the
      # generated file formatted so the PR passes lint.
      - if: steps.check.outputs.changed == 'true'
        run: pnpm exec biome format --write src/lib/constants.ts
      # Gated: create-pull-request rebuilds the branch from main every time it
      # runs, so invoking it on a no-change run force-resets an open PR's
      # branch to an empty diff (that emptied PR #33).
      - uses: peter-evans/create-pull-request@v7
        if: steps.check.outputs.changed == 'true'
        with:
          branch: fleet-watch
          # A review request notifies reliably regardless of watch settings —
          # a bot-authored PR alone can slip through as unwatched activity.
          reviewers: krystof-k
          title: Update AC tram fleet constants
          commit-message: |
            Update AC tram fleet constants

            ${{ steps.check.outputs.summary }}
          body: |
            Live-feed check: ${{ steps.check.outputs.summary }}

            Opened automatically by the Fleet watch workflow.
